# 集中管理项目中所有依赖的版本号

[versions]
# Kotlin
kotlin = "2.2.0"
kotlinx-html = "0.11.0"
ktor = "3.3.0"

# 核心依赖版本
kotlinxSerialization = "1.8.0"
kotlinxCoroutines = "1.8.1"
kotlinxDatetime = "0.6.1"
kotlinxIo = "0.6.0"

# Markdown处理
jetbrainsMarkdown = "0.7.3"

# 第三方库
ksvg = "2.2.0"
kaml = "0.98.0"
jupyterNotebooksParser = "0.3.0-dev.1"
highlights = "1.1.0"
feishu2html = "1.0.3-dev.5"
kotlinx-cli = "0.3.6"
kotlin-logging = "7.0.3"
kmp-process = "0.4.0"
uri-kmp = "0.0.18"
kotlin-env-var = "1.0.6"

# 测试框架
kotest = "5.9.0"

# Gradle插件
ktlint = "12.2.0"
i18n4k = "0.11.0"


[libraries]
# Ktor（仅保留实际使用的）
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-host-common = { module = "io.ktor:ktor-server-host-common", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# HTML
kotlinx-html = { module = "org.jetbrains.kotlinx:kotlinx-html", version.ref = "kotlinx-html" }

# CSS（仅 themes 模块使用）
kotlin-css = { module = "org.jetbrains.kotlin-wrappers:kotlin-css-jvm", version = "2025.6.4" }

# Kotlin 基础
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test" }

# 序列化
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# 协程
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }

# 日期时间
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }

# Markdown处理
jetbrains-markdown = { module = "org.jetbrains:markdown", version.ref = "jetbrainsMarkdown" }

# SVG处理（themes 模块使用）
ksvg = { module = "com.github.nwillc:ksvg", version.ref = "ksvg" }

# 国际化
i18n4k-core = { module = "de.comahe.i18n4k:i18n4k-core", version.ref = "i18n4k" }

# YAML解析
kaml = { module = "com.charleskorn.kaml:kaml", version.ref = "kaml" }

# Jupyter Notebook解析
jupyter-notebooks-parser = { module = "dev.yidafu.jupyter:jupyter-notebooks-parser", version.ref = "jupyterNotebooksParser" }

# 代码高亮
highlights = { module = "dev.snipme:highlights", version.ref = "highlights" }

# 飞书文档
feishu2html = { module = "dev.yidafu.feishu2html:feishu2html", version.ref = "feishu2html" }

# CLI
kotlinx-cli = { module = "org.jetbrains.kotlinx:kotlinx-cli", version.ref = "kotlinx-cli" }

# 日志
kotlin-logging = { module = "io.github.oshai:kotlin-logging", version.ref = "kotlin-logging" }

# IO
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinxIo" }

# 进程执行
kmp-process = { module = "io.matthewnelson.kmp-process:process", version.ref = "kmp-process" }

# URI
uri-kmp = { module = "com.eygraber:uri-kmp", version.ref = "uri-kmp" }

# 环境变量
kotlin-env-var = { module = "dev.scottpierce:kotlin-env-var", version.ref = "kotlin-env-var" }

# 测试框架
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
i18n4k = { id = "de.comahe.i18n4k", version.ref = "i18n4k" }
