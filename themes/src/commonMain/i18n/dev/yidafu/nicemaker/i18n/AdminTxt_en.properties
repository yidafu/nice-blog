# Error Pages
error_400_title=Bad Request
error_400_desc=Sorry, your request format is incorrect or contains invalid parameters. Please check and try again.
error_401_title=Unauthorized
error_401_desc=Sorry, you need to log in first to access this page. Please log in and try again.
error_403_title=Forbidden
error_403_desc=Sorry, you do not have permission to access this page. Please make sure you are logged in and have the appropriate access rights.
error_404_title=Page Not Found
error_404_desc=Sorry, the page you are looking for does not exist. The link may be expired or the page may have been removed.
error_405_title=Method Not Allowed
error_405_desc=Sorry, this resource does not support the HTTP method you are using.
error_408_title=Request Timeout
error_408_desc=Sorry, your request took too long and has timed out. Please refresh the page and try again.
error_429_title=Too Many Requests
error_429_desc=Sorry, you are sending requests too frequently and have triggered rate limiting. Please try again later.
error_500_title=Internal Server Error
error_500_desc=Sorry, the server encountered an error and could not complete your request. We will fix this issue as soon as possible.
error_502_title=Bad Gateway
error_502_desc=Sorry, the server received an invalid response when acting as a gateway or proxy. Please try again later.
error_503_title=Service Unavailable
error_503_desc=Sorry, the server is currently unable to handle your request. It may be under maintenance, please try again later.
error_504_title=Gateway Timeout
error_504_desc=Sorry, the server response timed out. Please try again later or contact the administrator.

