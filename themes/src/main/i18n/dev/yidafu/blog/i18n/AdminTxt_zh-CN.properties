# 错误页面
error_400_title=错误的请求
error_400_desc=抱歉，您的请求格式不正确或包含无效参数。请检查后重试。
error_401_title=未授权
error_401_desc=抱歉，您需要先登录才能访问此页面。请登录后重试。
error_403_title=访问被拒绝
error_403_desc=抱歉，您没有权限访问此页面。请确认您已登录并拥有相应的访问权限。
error_404_title=页面未找到
error_404_desc=抱歉，您访问的页面不存在。可能是链接已失效或页面已被移除。
error_405_title=方法不允许
error_405_desc=抱歉，此资源不支持您使用的 HTTP 方法。
error_408_title=请求超时
error_408_desc=抱歉，您的请求处理时间过长已超时。请刷新页面重试。
error_429_title=请求过于频繁
error_429_desc=抱歉，您的请求过于频繁，已触发限流保护。请稍后重试。
error_500_title=服务器内部错误
error_500_desc=抱歉，服务器遇到了一个错误，无法完成您的请求。我们会尽快修复此问题。
error_502_title=网关错误
error_502_desc=抱歉，服务器作为网关或代理时收到了无效的响应。请稍后重试。
error_503_title=服务不可用
error_503_desc=抱歉，服务器当前无法处理您的请求。可能正在维护中，请稍后重试。
error_504_title=网关超时
error_504_desc=抱歉，服务器响应超时。请稍后重试或联系管理员。

